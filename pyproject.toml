[project]
name = "embeddinggemma1"
version = "0.1.0"
description = "A collection of sample scripts demonstrating the use of Google's EmbeddingGemma model."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sentence-transformers>=2.7.0",
    "transformers @ git+https://github.com/huggingface/transformers@v4.56.0-Embedding-Gemma-preview",
    "torch>=2.3.0",
    "tf-keras>=2.16.0",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "huggingface-hub>=0.23.0",
    "click>=8.1.7",
    "hdbscan>=0.8.40",
]

[tool.uv]
# uv.lock を生成した際のハッシュ値などをここに記述できます
# (今回はuvが自動管理するため、特に記述は不要です)